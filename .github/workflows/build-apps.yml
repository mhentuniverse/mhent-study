name: Build MHEnt Study Apps (Windows & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. WINDOWS DESKTOP BUILD (.EXE)
  # ==========================================
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: node build-web.js

      - name: Build Windows Installer & Portable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "windows-build.log"
          $output = & node .\node_modules\electron-builder\cli.js --publish never 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $logPath
          if ($exitCode -ne 0) {
            Write-Error "Windows build failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Upload Windows Executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MHEnt-Study-Windows-Desktop
          path: |
            dist/*.exe
            dist/*.nsis.7z
            ${{ runner.temp }}/windows-build.log
          if-no-files-found: error

  # ==========================================
  # 2. ANDROID MOBILE BUILD (.APK)
  # ==========================================
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build-web.js
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MHEnt-Study-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ==========================================
  # 3. CREATE GITHUB RELEASE (after both builds)
  # ==========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-windows, build-android ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version from package.json
        id: pkg
        shell: bash
        run: |
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MHEnt-Study-Windows-Desktop
          path: release-assets/windows/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MHEnt-Study-Android-APK
          path: release-assets/android/
        continue-on-error: true

      - name: Rename artifacts for release
        shell: bash
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          ls -la release-assets/windows/ || echo "No windows files"
          ls -la release-assets/android/ || echo "No android files"

          while IFS= read -r -d '' f; do
            FNAME="$(basename "$f")"
            NEWNAME="$(printf '%s' "$FNAME" | sed 's/ /-/g')"
            if [ "$FNAME" != "$NEWNAME" ]; then
              mv "$f" "release-assets/windows/$NEWNAME"
            fi
          done < <(find release-assets/windows -maxdepth 1 -type f \( -name '*.exe' -o -name '*.nsis.7z' \) -print0)

          # Flatten android apks
          find release-assets/android -name "*.apk" -exec mv {} release-assets/android/ \; 2>/dev/null || true
          for f in release-assets/android/*.apk; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            NEWNAME=$(printf '%s' "$FNAME" | sed 's/ /-/g')
            if [ "$FNAME" != "$NEWNAME" ]; then
              mv "$f" "release-assets/android/$NEWNAME"
            fi
          done

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          trap 'rm -f "$NOTES_FILE"' EXIT
          cat > "$NOTES_FILE" <<EOF
          ## 📦 MHEnt Study v${VERSION}

          ### Tải về / Download

          | Nền tảng | File | Mô tả |
          |---|---|---|
          | 🖥️ Windows | `MHEnt-Study-Setup-*.exe` | Bộ cài đặt (NSIS Installer) |
          | 🖥️ Windows | `MHEnt-Study-*.exe` (Portable) | Không cần cài đặt, chạy thẳng |
          | 🤖 Android | `app-debug.apk` | APK Debug (cho thử nghiệm) |

          ### Hướng dẫn cài đặt
          - **Windows**: Tải file `.exe` → Chạy → Làm theo hướng dẫn
          - **Android**: Tải file `.apk` → Bật "Cài ứng dụng từ nguồn không xác định" → Cài đặt
          - **iPhone/iPad (iOS)**: Vào [study.mhentuniverse.com](https://study.mhentuniverse.com) bằng Safari → Nhấn **Share** → **Thêm vào Màn hình chính**

          ---
          *Build tự động bởi GitHub Actions • ${GITHUB_SHA}*
          EOF

          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --target "$GITHUB_SHA" --title "MHEnt Study v${VERSION}" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "MHEnt Study v${VERSION}" --notes-file "$NOTES_FILE"
            fi
            if gh release upload "$TAG" release-assets/windows/*.exe release-assets/windows/*.nsis.7z release-assets/android/*.apk --clobber; then
              exit 0
            fi
            echo "Release API attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1

      - name: Cleanup release files
        if: always()
        run: rm -f "${{ runner.temp }}/release-notes.md"
