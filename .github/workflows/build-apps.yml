name: Build MHEnt Study Apps (Windows & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. WINDOWS DESKTOP BUILD (.EXE)
  # ==========================================
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: node build-web.js

      - name: Build Windows Installer & Portable EXE
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: MHEnt-Study-Windows-Desktop
          path: |
            dist/*.exe
          if-no-files-found: error

  # ==========================================
  # 2. ANDROID MOBILE BUILD (.APK & .AAB)
  # ==========================================
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build-web.js
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MHEnt-Study-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
