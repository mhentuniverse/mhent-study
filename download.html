<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Tiếp Cổng Tải Ứng Dụng | MHEnt. Apps</title>
    <meta http-equiv="refresh" content="0; url=https://apps.mhentuniverse.com/study?download=true">
    <link rel="canonical" href="https://apps.mhentuniverse.com/study?download=true">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/study-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #060913;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(168, 85, 247, 0.18) 0%, rgba(6, 9, 19, 0.95) 75%);
            pointer-events: none;
        }
        .redirect-card {
            position: relative;
            z-index: 1;
            background: rgba(13, 19, 36, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.25);
        }
        .logo-box {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #090e1c;
            padding: 10px;
            margin: 0 auto 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(236, 72, 153, 0.35);
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f472b6, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f472b6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-direct {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 24px;
            border-radius: 14px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
            transition: all 0.2s ease;
        }
        .btn-direct:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(236, 72, 153, 0.5);
        }
    </style>
    <script>
        window.location.replace("https://apps.mhentuniverse.com/study?download=true");
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="logo-box">
            <img src="/assets/study-logo.png" alt="MHEnt. Study">
        </div>
        <div class="spinner"></div>
        <h1>Đang Chuyển Tiếp Tới MHEnt Apps...</h1>
        <p>Cổng tải ứng dụng MHEnt Study đã được tích hợp tập trung vào Trung Tâm Ứng Dụng <strong>apps.mhentuniverse.com</strong> để tải bản Windows (.exe) và Android (.apk) với tốc độ cao nhất.</p>
        <a href="https://apps.mhentuniverse.com/study?download=true" class="btn-direct">
            <span>Bấm vào đây để tải ngay →</span>
        </a>
    </div>
</body>
</html>
